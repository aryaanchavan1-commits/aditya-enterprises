name: arynoxtech_erp
description: ArynoxTech ERP Suite 2026 - Complete Business Management Solution
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # UI Components
  material_design_icons_flutter: ^7.0.7296
  flutter_screenutil: ^5.9.3
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1

  # Charts & Visualization
  fl_chart: ^0.68.0
  syncfusion_flutter_charts: ^26.1.35
  syncfusion_flutter_datagrid: ^26.1.35

  # Data Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  path: ^1.9.0

  # Network & API
  dio: ^5.4.3+1
  retrofit: ^4.1.0
  json_annotation: ^4.9.0

  # Image Handling
  image_picker: ^1.1.2
  image_cropper: ^7.0.4
  cached_network_image: ^3.3.1
  image: ^4.2.0

  # Barcode & QR
  barcode_widget: ^2.0.4
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # Printing
  printing: ^5.12.0
  pdf: ^3.10.8

  # File Operations
  file_picker: ^8.0.5
  open_filex: ^4.4.0
  share_plus: ^9.0.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  logger: ^2.3.0
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0

  # AI Integration
  http: ^1.2.1

  # Desktop Specific
  window_manager: ^0.3.9
  system_tray: ^2.0.3
  desktop_drop: ^0.5.0
  pasteboard: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  retrofit_generator: ^8.1.0
  json_serializable: ^6.8.0
  freezed: ^2.5.2
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1
  msix: ^3.16.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
    icon_size: 48

msix_config:
  display_name: ArynoxTech ERP Suite 2026
  publisher_display_name: Sainath Enterprises
  identity_name: com.arynoxtech.erp
  msix_version: 1.0.0.0
  certificate_path: C:\Certificates\ARYNOX_CERT.pfx
  certificate_password: your_password
  logo_path: assets/images/app_icon.png
  capabilities: internetClient, location, webcam
