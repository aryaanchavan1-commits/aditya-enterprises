services:
  - type: web
    name: aditya-enterprises-erp
    env: node
    region: singapore
    buildCommand: cd client && npm install && npm run build
    startCommand: node api/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
